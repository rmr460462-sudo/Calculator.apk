<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  body {
    margin: 0;
    background: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }
  .calc {
    width: 100%;
    max-width: 360px;
    background: #1e1e1e;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  #display {
    width: 100%;
    height: 64px;
    font-size: 28px;
    text-align: right;
    border: none;
    border-radius: 10px;
    background: #2b2b2b;
    color: #fff;
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    height: 58px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  button.op { background: #ff9500; color: #fff; }
  button.clear { background: #d9534f; color: #fff; }
  button.eq { background: #28a745; color: #fff; }
</style>
</head>
<body>
<div class="calc">
  <input type="text" id="display" readonly>
  <div class="grid">
    <button class="clear" onclick="clr()">C</button>
    <button onclick="add('(')">(</button>
    <button onclick="add(')')">)</button>
    <button class="op" onclick="add('/')">/</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="op" onclick="add('*')">*</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="op" onclick="add('-')">-</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="op" onclick="add('+')">+</button>

    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
    <button onclick="del()">⌫</button>
    <button class="eq" onclick="calc()">=</button>
  </div>
</div>
<script>
  const disp = document.getElementById("display");
  function add(v) { disp.value += v; }
  function clr() { disp.value = ""; }
  function del() { disp.value = disp.value.slice(0, -1); }
  function calc() {
    try {
      if (!disp.value) return;
      const safe = disp.value.replace(/[^0-9+\-*/().]/g, "");
      const res = Function('"use strict";return (' + safe + ')')();
      disp.value = Number.isFinite(res) ? res : "Error";
    } catch {
      disp.value = "Error";
    }
  }
</script>
</body>
</html>
